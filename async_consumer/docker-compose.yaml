services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rmq_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  consumer:
    build: .
    command: ["python", "-m", "async_consumer.consumer"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RMQ_HOST=rabbitmq
      - RMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - SHUTDOWN_TIMEOUT=10
    networks:
      - rmq_network
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGTERM  

  producer:
    build: .
    command: ["python", "-m", "async_consumer.publisher"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RMQ_HOST=rabbitmq
      - RMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - rmq_network
    restart: unless-stopped

networks:
  rmq_network:
    driver: bridge

volumes:
  rabbitmq-data: